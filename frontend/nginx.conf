events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }
        
        # ESTA ES LA NUEVA REGLA PARA EL CALLBACK
        location /auth/google/callback {
            proxy_pass http://backend:3100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
   
        location /api {
            rewrite ^/api/(.*)$ /$1 break;  # <-- reconstrucción petición API
            proxy_pass http://backend:3100;
            add_header X-DEBUG-LOCATION "API-Block-Was-Here"; # <-- Para avisar que Api funciona correctamente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
